[package]
name = "pumpkin-worldgen-model"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true

[features]
runtime = ["dep:pumpkin-data"]
codegen = ["dep:heck", "dep:proc-macro2", "dep:quote", "dep:syn"]

[dependencies]
pumpkin-data = { path = "../pumpkin-data", optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
md5.workspace = true
heck = { version = "0.5", optional = true }
proc-macro2 = { version = "1.0", optional = true }
quote = { version = "1.0", optional = true }
syn = { version = "3.0", optional = true }

[lints]
workspace = true
